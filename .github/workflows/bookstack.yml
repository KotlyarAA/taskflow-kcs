name: KCS BookStack Sync

on:
  issues:
    types: [opened, edited, closed]

jobs:
  sync-to-bookstack:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install marked
        run: npm install marked

      - name: Create BookStack page
        if: github.event.action == 'opened'
        env:
          BOOKSTACK_URL: ${{ secrets.BOOKSTACK_URL }}
          BOOKSTACK_TOKEN_ID: ${{ secrets.BOOKSTACK_TOKEN_ID }}
          BOOKSTACK_TOKEN_SECRET: ${{ secrets.BOOKSTACK_TOKEN_SECRET }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

        run: |
          node <<'EOF'
          const { marked } = require('marked');

          const title = process.env.ISSUE_TITLE;
          const body = process.env.ISSUE_BODY || '';
          const issueUrl = process.env.ISSUE_URL;

          const html = marked.parse(body) +
            `<hr><p><strong>GitHub Issue:</strong> <a href="${issueUrl}">${issueUrl}</a></p>`;

          fetch(`${process.env.BOOKSTACK_URL}/api/pages`, {
            method: 'POST',

            headers: {
              'Authorization':
                `Token ${process.env.BOOKSTACK_TOKEN_ID}:${process.env.BOOKSTACK_TOKEN_SECRET}`,
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              book_id: 1,
              name: title,
              html: html
            })
          })
          .then(async response => {
            const text = await response.text();

            if (!response.ok) {
              throw new Error(
                `BookStack API error ${response.status}: ${text}`
              );
            }

            console.log('BookStack page created successfully');
            console.log(text);
          })
          .catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
